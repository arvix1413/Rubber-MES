version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: rubber-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "10103:3306"
    networks:
      - rubber-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rubber-backend:
    image: ${DOCKER_HUB_USER:-arvix1413}/rubber-backend:latest
    container_name: rubber-backend
    restart: unless-stopped
    ports:
      - "10102:3001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rubber-network

  rubber-frontend:
    image: ${DOCKER_HUB_USER:-arvix1413}/rubber-frontend:latest
    container_name: rubber-frontend
    restart: unless-stopped
    ports:
      - "10101:80"
    depends_on:
      - rubber-backend
    networks:
      - rubber-network

volumes:
  mysql-data:

networks:
  rubber-network:
    driver: bridge
