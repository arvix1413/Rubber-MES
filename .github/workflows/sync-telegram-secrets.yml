name: Sync Telegram secrets to CF repos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TARGET_REPOS: >-
        tmt
        zenlet-v2
        meierq-v2
        molava-v2
        tinywearhouse-v2
        ims-v2
        shopline-v2
    steps:
      - name: Sync TELEGRAM_* to Cloudflare deploy repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID on this repo"
            exit 1
          fi

          for repo in ${TARGET_REPOS}; do
            echo "Syncing arvix1413/${repo} ..."
            gh secret set TELEGRAM_BOT_TOKEN -R "arvix1413/${repo}" -b"${TELEGRAM_BOT_TOKEN}"
            gh secret set TELEGRAM_CHAT_ID -R "arvix1413/${repo}" -b"${TELEGRAM_CHAT_ID}"
          done

          echo "Done. Trigger a deploy on tmt to verify Telegram group notification."
