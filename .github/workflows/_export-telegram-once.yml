name: Export Telegram for local sync (one-time)

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write deploy telegram config
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p out
          printf '%s' "${TELEGRAM_BOT_TOKEN}" > out/bot.txt
          printf '%s' "${TELEGRAM_CHAT_ID}" > out/chat.txt

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-deploy-config
          path: out/
          retention-days: 1
