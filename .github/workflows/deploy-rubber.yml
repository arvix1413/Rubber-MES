name: Build & Deploy Rubber MES

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy-rubber:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push Rubber Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USER }}/rubber-backend:latest

      - name: Build & Push Rubber Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.rubber
          push: true
          tags: ${{ secrets.DOCKER_HUB_USER }}/rubber-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://43.133.56.234:10102

      - name: Deploy Rubber to Server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: /opt/rubber/deploy.sh
