name: Daily Patrol (Rubber-MES)

on:
  schedule:
    # 每天早上 11:00（台北时间 = UTC 03:00）
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  patrol:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PATROL_PROJECT_NAME: Rubber-MES
      RUBBER_FRONTEND_URL: http://43.160.199.226:10101
      RUBBER_API_URL: http://43.160.199.226:10102
      RUBBER_PATROL_EMAIL: ${{ secrets.RUBBER_PATROL_EMAIL }}
      RUBBER_PATROL_PASSWORD: ${{ secrets.RUBBER_PATROL_PASSWORD }}
      TELEGRAM_PATROL_BOT_TOKEN: ${{ secrets.TELEGRAM_PATROL_BOT_TOKEN }}
      TELEGRAM_PATROL_CHAT_ID: ${{ secrets.TELEGRAM_PATROL_CHAT_ID }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run daily patrol
        run: node scripts/daily-patrol.mjs
